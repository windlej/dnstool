[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnstool"
version = "0.1.0"
description = "All-in-one DNS analysis tool with TUI interface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jeremiah" }]
keywords = ["dns", "tui", "dmarc", "dkim", "spf", "dnssec", "networking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "dnspython>=2.4.0",
    "textual>=0.47.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "apscheduler>=3.10.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
dnstool = "dnstool.__main__:app"

[project.urls]
Repository = "https://github.com/jeremiah/dnstool"

[tool.hatch.build.targets.wheel]
packages = ["src/dnstool"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["B008"]  # Typer uses function calls in defaults

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
